version: '3.8'

# Stack de Monitoramento para eSocial-JT
# Inclui Prometheus, Grafana e configuracoes de alerta

services:
  # Prometheus - Coleta e armazenamento de metricas
  prometheus:
    image: prom/prometheus:v2.40.0
    container_name: esocial-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./src/esocial-jt-service/src/main/resources/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--rule.files=/etc/prometheus/alerts.yml'
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana - Visualizacao de dashboards
  grafana:
    image: grafana/grafana:9.3.0
    container_name: esocial-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./src/esocial-jt-service/src/main/resources/grafana-dashboard.json:/var/lib/grafana/dashboards/esocial-jt-main.json:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
